server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx's default table has no entry for .mjs, so it would serve the map's
    # web worker as application/octet-stream — and browsers refuse to run a
    # module worker with that type. (Re-including the table here because a
    # `types` block in a server replaces the inherited one.)
    include /etc/nginx/mime.types;
    types {
        text/javascript mjs;
    }

    # The main JS bundle is ~3 MB; compressed it is under 1 MB.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json image/svg+xml application/wasm;

    # Vite fingerprints everything under /assets/ (the name changes whenever the
    # content does), so browsers can keep these forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html is what points at the current hashed files — never cache it,
    # or a redeploy would keep serving the old app.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Logos and other files from public/.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
